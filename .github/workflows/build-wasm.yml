name: Build Acoustic WASM


# ============================================================
# HAMMER CRAFT
# Rust Acoustic Engine -> WebAssembly
#
# Repository:
#
# HammerCraft/
# ├── .github/
# │   └── workflows/
# │       └── build-wasm.yml
# │
# └── docs/
#     ├── acoustic-engine/
#     │   ├── Cargo.toml
#     │   └── src/
#     │
#     ├── wasm/
#     │
#     ├── iem-designer.html
#     ├── iem-designer.js
#     └── ...
#
#
# BEHAVIOUR
#
# Any normal push to main:
#
#   push to main
#       ↓
#   build Rust engine
#       ↓
#   generate docs/wasm/
#       ↓
#   commit generated WASM
#       ↓
#   generated-WASM commit is ignored
#
#
# This avoids having to manually press "Run workflow".
# ============================================================


on:

  # ----------------------------------------------------------
  # AUTOMATIC BUILD
  #
  # Run whenever main changes.
  #
  # Ignore commits which ONLY modify docs/wasm/**.
  # This prevents the workflow's own generated WASM commit
  # from starting another WASM build.
  # ----------------------------------------------------------

  push:
    branches:
      - main

    paths-ignore:
      - "docs/wasm/**"


  # ----------------------------------------------------------
  # MANUAL BUILD
  #
  # Keep this available as a backup.
  # ----------------------------------------------------------

  workflow_dispatch:


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: write


# ============================================================
# CONCURRENCY
#
# Prevent multiple WASM builds from trying to push generated
# files at the same time.
# ============================================================

concurrency:

  group: hammer-craft-wasm-main

  cancel-in-progress: true


# ============================================================
# JOBS
# ============================================================

jobs:

  build-wasm:

    name: Compile Rust Acoustic Engine

    runs-on: ubuntu-latest


    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout HammerCraft repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

          ref: main


      # ======================================================
      # 2. INSTALL RUST
      # ======================================================

      - name: Install Rust toolchain

        uses: dtolnay/rust-toolchain@stable

        with:

          targets: wasm32-unknown-unknown


      # ======================================================
      # 3. SHOW RUST VERSION
      # ======================================================

      - name: Show Rust versions

        run: |

          rustc --version

          cargo --version


      # ======================================================
      # 4. CACHE RUST BUILD
      # ======================================================

      - name: Cache Rust build

        uses: Swatinem/rust-cache@v2

        with:

          workspaces: |
            docs/acoustic-engine -> target


      # ======================================================
      # 5. INSTALL WASM-PACK
      # ======================================================

      - name: Install wasm-pack

        run: |

          if command -v wasm-pack >/dev/null 2>&1; then

            echo "wasm-pack is already installed."

          else

            echo "Installing wasm-pack..."

            cargo install wasm-pack --locked

          fi


      # ======================================================
      # 6. SHOW WASM-PACK VERSION
      # ======================================================

      - name: Show wasm-pack version

        run: |

          wasm-pack --version


      # ======================================================
      # 7. VERIFY SOURCE DIRECTORY
      # ======================================================

      - name: Verify acoustic engine source exists

        run: |

          echo ""
          echo "=========================================="
          echo "Checking acoustic engine source"
          echo "=========================================="
          echo ""

          if [ ! -d "docs/acoustic-engine" ]; then

            echo "ERROR:"
            echo "docs/acoustic-engine directory does not exist."

            exit 1

          fi


          if [ ! -f "docs/acoustic-engine/Cargo.toml" ]; then

            echo "ERROR:"
            echo "docs/acoustic-engine/Cargo.toml does not exist."

            exit 1

          fi


          if [ ! -d "docs/acoustic-engine/src" ]; then

            echo "ERROR:"
            echo "docs/acoustic-engine/src does not exist."

            exit 1

          fi


          echo "Acoustic engine source found."

          echo ""

          echo "Cargo.toml:"
          ls -lah docs/acoustic-engine/Cargo.toml

          echo ""

          echo "Source files:"
          ls -lah docs/acoustic-engine/src


      # ======================================================
      # 8. PREPARE WASM OUTPUT DIRECTORY
      # ======================================================

      - name: Prepare WASM output directory

        run: |

          echo ""
          echo "=========================================="
          echo "Preparing WASM output directory"
          echo "=========================================="
          echo ""

          mkdir -p docs/wasm


          echo "Removing previous generated WASM files..."

          rm -f docs/wasm/acoustic_engine.js

          rm -f docs/wasm/acoustic_engine_bg.wasm

          rm -f docs/wasm/acoustic_engine.d.ts

          rm -f docs/wasm/acoustic_engine_bg.wasm.d.ts

          rm -f docs/wasm/package.json


          echo ""

          echo "WASM output directory ready."


      # ======================================================
      # 9. CARGO CHECK
      # ======================================================

      - name: Check Rust acoustic engine

        working-directory: docs/acoustic-engine

        run: |

          echo ""
          echo "=========================================="
          echo "Running cargo check"
          echo "=========================================="
          echo ""

          cargo check


      # ======================================================
      # 10. BUILD RUST -> WASM
      # ======================================================

      - name: Build Hammer Craft acoustic engine

        working-directory: docs/acoustic-engine

        run: |

          echo ""
          echo "=========================================="
          echo "Building Hammer Craft WASM"
          echo "=========================================="
          echo ""

          wasm-pack build \
            --target web \
            --release \
            --out-dir ../wasm \
            --out-name acoustic_engine


      # ======================================================
      # 11. VERIFY GENERATED FILES
      # ======================================================

      - name: Verify WASM build

        run: |

          echo ""
          echo "=========================================="
          echo "Generated WASM files"
          echo "=========================================="
          echo ""

          ls -lah docs/wasm

          echo ""
          echo "Checking required browser files..."
          echo ""


          if [ ! -f "docs/wasm/acoustic_engine.js" ]; then

            echo "ERROR:"
            echo "docs/wasm/acoustic_engine.js was not generated."

            exit 1

          fi


          if [ ! -f "docs/wasm/acoustic_engine_bg.wasm" ]; then

            echo "ERROR:"
            echo "docs/wasm/acoustic_engine_bg.wasm was not generated."

            exit 1

          fi


          echo ""
          echo "WASM build verified successfully."
          echo ""


      # ======================================================
      # 12. SHOW OUTPUT SIZE
      # ======================================================

      - name: Show generated file sizes

        run: |

          echo ""
          echo "=========================================="
          echo "WASM output size"
          echo "=========================================="
          echo ""

          echo "acoustic_engine.js:"
          du -h docs/wasm/acoustic_engine.js

          echo ""

          echo "acoustic_engine_bg.wasm:"
          du -h docs/wasm/acoustic_engine_bg.wasm

          echo ""


      # ======================================================
      # 13. CONFIGURE GIT
      # ======================================================

      - name: Configure Git

        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


      # ======================================================
      # 14. STAGE GENERATED WASM
      # ======================================================

      - name: Stage generated WASM files

        run: |

          echo ""
          echo "=========================================="
          echo "Staging generated WASM"
          echo "=========================================="
          echo ""


          # Force-add because WASM files may be ignored by a
          # repository or global .gitignore rule.

          git add -f docs/wasm/


          echo "Git status:"
          git status --short


      # ======================================================
      # 15. COMMIT GENERATED WASM
      # ======================================================

      - name: Commit generated WASM files

        run: |

          echo ""
          echo "=========================================="
          echo "Checking generated WASM changes"
          echo "=========================================="
          echo ""


          if git diff --cached --quiet; then

            echo "No generated WASM changes detected."

            echo "Nothing needs to be committed."

          else

            echo "Generated WASM changed."

            echo ""

            echo "Creating generated WASM commit..."


            git commit \
              -m "Build Hammer Craft acoustic engine WASM"


            echo ""

            echo "WASM commit created."

          fi


      # ======================================================
      # 16. UPDATE MAIN AND PUSH
      # ======================================================

      - name: Push generated WASM to main

        run: |

          echo ""
          echo "=========================================="
          echo "Updating main"
          echo "=========================================="
          echo ""


          # If no commit was created in the previous step,
          # there is nothing to push.

          if git log -1 --pretty=%B | grep -q \
            "^Build Hammer Craft acoustic engine WASM$"; then

            echo "Generated WASM commit detected."

            echo ""

            echo "Rebasing onto latest main..."


            git pull \
              --rebase \
              origin \
              main


            echo ""

            echo "Pushing generated WASM..."


            git push \
              origin \
              HEAD:main


            echo ""

            echo "Generated WASM pushed successfully."

          else

            echo "No new generated WASM commit."

            echo "Skipping push."

          fi


      # ======================================================
      # 17. FINAL STATUS
      # ======================================================

      - name: Final build status

        run: |

          echo ""
          echo "=========================================="
          echo "HAMMER CRAFT ACOUSTIC ENGINE"
          echo "=========================================="
          echo ""

          echo "Rust -> WebAssembly build complete."

          echo ""

          echo "Generated website files:"

          echo "  docs/wasm/acoustic_engine.js"

          echo "  docs/wasm/acoustic_engine_bg.wasm"

          echo ""

          echo "GitHub Pages can now deploy the updated docs/ directory."

          echo ""

          echo "Expected website module:"

          echo "https://www.hammer-craft.co.uk/wasm/acoustic_engine.js"

          echo ""