name: Build Acoustic WASM

# ============================================================
# HAMMER CRAFT
# Rust Acoustic Engine -> WebAssembly
#
# Repository layout used by this workflow:
#
# HammerCraft/
# ├── .github/
# │   └── workflows/
# │       └── build-wasm.yml
# │
# └── docs/
#     ├── acoustic-engine/
#     │   ├── Cargo.toml
#     │   └── src/
#     │
#     ├── wasm/
#     │
#     ├── iem-designer.html
#     ├── iem-designer.js
#     └── ...
#
# This workflow:
#   1. Checks out the repository
#   2. Installs Rust
#   3. Installs the wasm32 target
#   4. Installs wasm-pack
#   5. Checks the Rust acoustic engine
#   6. Builds Rust -> WebAssembly
#   7. Writes generated files to docs/wasm/
#   8. Verifies the required output exists
#   9. Commits generated WASM files back to main
#  10. GitHub Pages then redeploys docs/
# ============================================================


on:

  # ----------------------------------------------------------
  # Automatically rebuild when Rust source or this workflow
  # changes.
  # ----------------------------------------------------------

  push:
    branches:
      - main

    paths:
      - "docs/acoustic-engine/**"
      - ".github/workflows/build-wasm.yml"


  # ----------------------------------------------------------
  # Allow manual runs from GitHub Actions.
  # ----------------------------------------------------------

  workflow_dispatch:


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: write


# ============================================================
# JOB
# ============================================================

jobs:

  build-wasm:

    name: Compile Rust Acoustic Engine

    runs-on: ubuntu-latest


    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout HammerCraft repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # ======================================================
      # 2. INSTALL RUST
      # ======================================================

      - name: Install Rust toolchain

        uses: dtolnay/rust-toolchain@stable

        with:
          targets: wasm32-unknown-unknown


      # ======================================================
      # 3. SHOW RUST VERSION
      # ======================================================

      - name: Show Rust versions

        run: |
          rustc --version
          cargo --version


      # ======================================================
      # 4. CACHE RUST BUILD
      # ======================================================

      - name: Cache Rust build

        uses: Swatinem/rust-cache@v2

        with:
          workspaces: |
            docs/acoustic-engine -> target


      # ======================================================
      # 5. INSTALL WASM-PACK
      # ======================================================

      - name: Install wasm-pack

        run: |
          if command -v wasm-pack >/dev/null 2>&1; then
            echo "wasm-pack is already installed."
          else
            cargo install wasm-pack --locked
          fi


      # ======================================================
      # 6. SHOW WASM-PACK VERSION
      # ======================================================

      - name: Show wasm-pack version

        run: |
          wasm-pack --version


      # ======================================================
      # 7. VERIFY SOURCE FOLDER
      # ======================================================

      - name: Verify acoustic engine source exists

        run: |
          echo "Checking docs/acoustic-engine..."

          if [ ! -d "docs/acoustic-engine" ]; then
            echo "ERROR: docs/acoustic-engine directory does not exist."
            exit 1
          fi

          if [ ! -f "docs/acoustic-engine/Cargo.toml" ]; then
            echo "ERROR: docs/acoustic-engine/Cargo.toml does not exist."
            exit 1
          fi

          echo "Acoustic engine source found."


      # ======================================================
      # 8. PREPARE WASM OUTPUT DIRECTORY
      # ======================================================

      - name: Prepare WASM output directory

        run: |
          mkdir -p docs/wasm

          echo "Removing previous generated WASM files..."

          rm -f docs/wasm/acoustic_engine.js
          rm -f docs/wasm/acoustic_engine_bg.wasm
          rm -f docs/wasm/acoustic_engine.d.ts
          rm -f docs/wasm/acoustic_engine_bg.wasm.d.ts
          rm -f docs/wasm/package.json


      # ======================================================
      # 9. CHECK RUST ENGINE
      # ======================================================

      - name: Check Rust acoustic engine

        working-directory: docs/acoustic-engine

        run: |
          cargo check


      # ======================================================
      # 10. BUILD RUST -> WASM
      # ======================================================

      - name: Build Hammer Craft acoustic engine

        working-directory: docs/acoustic-engine

        run: |
          wasm-pack build \
            --target web \
            --release \
            --out-dir ../wasm \
            --out-name acoustic_engine


      # ======================================================
      # 11. VERIFY GENERATED FILES
      # ======================================================

      - name: Verify WASM build

        run: |

          echo ""
          echo "=========================================="
          echo "Generated WASM files"
          echo "=========================================="
          echo ""

          ls -lah docs/wasm

          echo ""
          echo "Checking required browser files..."
          echo ""


          if [ ! -f "docs/wasm/acoustic_engine.js" ]; then

            echo "ERROR:"
            echo "docs/wasm/acoustic_engine.js was not generated."

            exit 1

          fi


          if [ ! -f "docs/wasm/acoustic_engine_bg.wasm" ]; then

            echo "ERROR:"
            echo "docs/wasm/acoustic_engine_bg.wasm was not generated."

            exit 1

          fi


          echo ""
          echo "WASM build verified successfully."
          echo ""


      # ======================================================
      # 12. SHOW OUTPUT SIZE
      # ======================================================

      - name: Show generated file sizes

        run: |

          echo "acoustic_engine.js:"
          du -h docs/wasm/acoustic_engine.js

          echo ""

          echo "acoustic_engine_bg.wasm:"
          du -h docs/wasm/acoustic_engine_bg.wasm


      # ======================================================
      # 13. CONFIGURE GIT
      # ======================================================

      - name: Configure Git

        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


      # ======================================================
      # 14. COMMIT GENERATED WASM
      # ======================================================

      - name: Commit generated WASM files

        run: |

          # Force-add in case an old .gitignore rule ignores wasm.
          git add -f docs/wasm/


          if git diff --cached --quiet; then

            echo ""
            echo "No generated WASM changes detected."
            echo "Nothing needs to be committed."

          else

            echo ""
            echo "Generated WASM changed."
            echo "Creating commit..."

            git commit \
              -m "Build Hammer Craft acoustic engine WASM"


            echo ""
            echo "Updating local branch before push..."

            git pull \
              --rebase \
              origin \
              main


            echo ""
            echo "Pushing generated WASM to main..."

            git push \
              origin \
              HEAD:main


            echo ""
            echo "Generated WASM committed successfully."

          fi


      # ======================================================
      # 15. FINAL CHECK
      # ======================================================

      - name: Final build status

        run: |

          echo ""
          echo "=========================================="
          echo "HAMMER CRAFT ACOUSTIC ENGINE"
          echo "=========================================="
          echo ""

          echo "Rust -> WebAssembly build complete."

          echo ""

          echo "Generated website files:"

          echo "  docs/wasm/acoustic_engine.js"
          echo "  docs/wasm/acoustic_engine_bg.wasm"

          echo ""

          echo "GitHub Pages should now redeploy docs/."

          echo ""

          echo "Expected deployed module URL:"

          echo "https://www.hammer-craft.co.uk/wasm/acoustic_engine.js"

          echo ""