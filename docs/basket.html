<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your basket | Hammer Craft</title>
    <link rel="icon" href="assets/favicon-32.png" type="image/png">
    <link rel="stylesheet" href="basket.css?v=1">
</head>
<body>
<header class="basket-header">
    <a href="index.html" class="basket-brand"><img src="assets/logo.png" alt="Hammer Craft"><span>HAMMER CRAFT</span></a>
    <a href="product.html" class="continue-link">CONTINUE SHOPPING →</a>
</header>
<main class="basket-page">
    <div class="basket-heading"><span class="eyebrow">HAMMER CRAFT / BASKET</span><h1>Your <em>basket.</em></h1></div>
    <div id="basketMessage" class="basket-message" role="status" aria-live="polite"></div>
    <section id="basketLoginRequired" class="notice" hidden>
        <h2>Sign in to view your basket.</h2>
        <p>Your basket is saved to your Hammer Craft account.</p>
        <a id="basketLoginButton" class="primary-button" href="login.html">SIGN IN →</a>
    </section>
    <div id="basketContent" class="basket-layout" hidden>
        <section id="basketItems" aria-label="Basket items"><p>Loading your basket…</p></section>
        <aside class="basket-summary" aria-label="Order summary">
            <span class="summary-label">ORDER SUMMARY</span>
            <div class="summary-row"><span>Items</span><strong id="basketItemCount">0</strong></div>
            <div class="summary-row total-row"><span>Subtotal</span><strong id="basketSubtotal">£0.00</strong></div>
            <button id="checkoutButton" class="checkout-button" type="button" disabled>CHECKOUT WITH PAYPAL →</button>
            <p class="summary-note">Review your items before continuing to PayPal.</p>
        </aside>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="basket.js?v=2"></script>
</body>
</html>
