<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | Hammer Craft
    </title>

    <link
        rel="stylesheet"
        href="auth.css"
    >

</head>


<body>


<header class="auth-header">

    <a
        href="index.html"
        class="auth-brand"
    >

        <img
            src="assets/logo.png"
            alt="Hammer Craft"
        >

        <span>
            HAMMER CRAFT
        </span>

    </a>


    <a
        href="register.html"
        class="header-button"
    >
        REGISTER
    </a>

</header>



<main class="auth-page">


    <section class="auth-intro">


        <div class="eyebrow">
            HAMMER CRAFT / LOGIN
        </div>


        <h1>

            Welcome

            <em>
                back.
            </em>

        </h1>


        <p>

            Sign in to access your Hammer Craft
            customer account or internal admin
            dashboard.

        </p>


    </section>



    <section class="auth-panel">


        <form id="loginForm">


            <label>

                EMAIL

                <input
                    id="loginEmail"
                    type="email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required
                >

            </label>



            <label>

                PASSWORD

                <input
                    id="loginPassword"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Your password"
                    required
                >

            </label>



            <div class="login-tools">


                <label class="check-row small-check">

                    <input
                        id="rememberMe"
                        type="checkbox"
                        checked
                    >

                    <span>
                        Remember me
                    </span>

                </label>


                <button
                    type="button"
                    id="forgotPasswordButton"
                    class="text-button"
                >
                    FORGOT PASSWORD?
                </button>


            </div>



            <button
                type="submit"
                class="main-button"
            >

                <span>
                    LOGIN
                </span>

                <span>
                    →
                </span>

            </button>


            <div
                id="loginMessage"
                class="form-message"
            ></div>


        </form>



        <div class="auth-panel-footer">

            New to Hammer Craft?

            <a href="register.html">
                Create an account
            </a>

        </div>


    </section>


</main>



<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="supabase-client.js"></script>

<script src="auth.js"></script>


</body>

</html>
