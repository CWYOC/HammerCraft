<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Order | Hammer Craft
    </title>

    <link
        rel="stylesheet"
        href="order.css?v=30"
    >

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="order-header">

    <a
        href="index.html"
        class="order-brand"
    >

        <img
            src="assets/logo.png"
            alt="Hammer Craft"
        >

        <span>
            HAMMER CRAFT
        </span>

    </a>


    <div class="order-header-actions">

        <a
            href="basket.html"
            class="header-link"
        >
            BASKET
        </a>

        <a
            href="account.html"
            class="header-link"
        >
            MY ACCOUNT
        </a>

    </div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="order-page">


    <div
        id="orderLoading"
        class="order-loading"
    >
        Loading order...
    </div>



    <section
        id="orderContent"
        hidden
    >


        <!-- =================================================
             ORDER HEADING
        ================================================== -->

        <div class="order-heading">

            <div>

                <div class="eyebrow">
                    HAMMER CRAFT / ORDER
                </div>


                <h1 id="orderNumber">
                    HC-
                </h1>

            </div>


            <div
                id="orderStatus"
                class="order-status"
            >
                —
            </div>

        </div>



        <!-- =================================================
             ORDER INFORMATION
        ================================================== -->

        <div class="order-grid">


            <article class="order-panel">

                <span class="panel-label">
                    ORDER SUMMARY
                </span>


                <div class="order-data">

                    <div>

                        <span>
                            TOTAL
                        </span>

                        <strong id="orderTotal">
                            —
                        </strong>

                    </div>


                    <div>

                        <span>
                            PAYMENT
                        </span>

                        <strong id="paymentStatus">
                            —
                        </strong>

                    </div>


                    <div>

                        <span>
                            ORDER DATE
                        </span>

                        <strong id="createdDate">
                            —
                        </strong>

                    </div>

                </div>

            </article>



            <article class="order-panel">

                <span class="panel-label">
                    ITEMS
                </span>


                <div
                    id="orderItems"
                    class="order-items"
                ></div>

            </article>


        </div>



        <!-- =================================================
             EAR SCAN
        ================================================== -->

        <section
            id="earScanSection"
            class="ear-scan-order-section"
            hidden
        >

            <div class="section-heading">

                <div>

                    <span class="panel-label">
                        CUSTOM FIT
                    </span>


                    <h2>
                        Digital ear scan.
                    </h2>

                </div>


                <div
                    id="earScanStatusBadge"
                    class="scan-status-badge"
                >
                    NOT SUBMITTED
                </div>

            </div>



            <div
                id="earScanContent"
                class="scan-content"
            ></div>

        </section>



        <!-- =================================================
             CUSTOMER FILES
        ================================================== -->

        <section class="files-section">

            <div class="files-heading">

                <div>

                    <span class="panel-label">
                        PRIVATE CUSTOMER FILES
                    </span>


                    <h2>
                        Order files.
                    </h2>

                </div>


                <label class="upload-button">

                    UPLOAD FILE

                    <input
                        id="customerFileInput"
                        type="file"
                        hidden
                    >

                </label>

            </div>


            <p class="files-description">

                Files uploaded here are private to
                your Hammer Craft account and this order.

            </p>


            <div
                id="customerFiles"
                class="files-list"
            ></div>


            <div
                id="fileMessage"
                class="file-message"
            ></div>

        </section>


    </section>


</main>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="supabase-client.js?v=20"></script>

<script src="order.js?v=30"></script>


</body>

</html>
